name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}

    strategy:
      # report every broken combination on a run, not just the first
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [ci, ci-release, ci-nofftw]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y swig libfftw3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # the runner image preinstalls aws/tap, which we do not use; brew
          # warns about untrusted taps on every install until it is gone
          brew untap aws/tap || true
          brew install swig fftw

      - name: Report toolchain
        run: |
          cmake --version
          swig -version
          python3 --version
          ${{ runner.os == 'Linux' && 'g++ --version' || 'clang++ --version' }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Import the Python module
        run: python3 -c "import loris; print(loris.version())"
        env:
          PYTHONPATH: build-${{ matrix.preset }}/scripting
